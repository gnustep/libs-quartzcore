name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tools_make_branch:
        description: "tools-make branch"
        default: "master"
        required: true
      libs_base_branch:
        description: "libs-base branch"
        default: "master"
        required: true
      libs_corebase_branch:
        description: "libs-corebase branch"
        default: "master"
        required: true
      libs_gui_branch:
        description: "libs-gui branch"
        default: "master"
        required: true
      libs_opal_branch:
        description: "libs-opal branch"
        default: "master"
        required: true
      libs_back_branch:
        description: "libs-back branch"
        default: "master"
        required: true

jobs:
  ########### Linux ###########
  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # don't run pull requests from local branches twice
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x64 Clang gnustep-1.9
            library-combo: ng-gnu-gnu
            runtime-version: gnustep-1.9
            CC: clang
            CXX: clang++

          - name: Ubuntu x64 Clang gnustep-2.0
            library-combo: ng-gnu-gnu
            runtime-version: gnustep-2.0
            CC: clang
            CXX: clang++

    env:
      SRC_PATH: ${{ github.workspace }}/source
      DEPS_PATH: ${{ github.workspace }}/dependencies
      INSTALL_PATH: ${{ github.workspace }}/build
      CC: ${{ matrix.CC }}
      CXX: ${{ matrix.CXX }}
      LIBRARY_COMBO: ${{ matrix.library-combo }}
      RUNTIME_VERSION: ${{ matrix.runtime-version }}

    defaults:
      run:
        working-directory: ${{ env.SRC_PATH }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: ${{ env.SRC_PATH }}

      - name: Install packages
        run: ./scripts/install-packages.sh

      - name: Install dependencies
        env:
          TOOLS_MAKE_BRANCH: ${{github.event.inputs.tools_make_branch}}
          LIBS_BASE_BRANCH: ${{github.event.inputs.libs_base_branch}}
          LIBS_COREBASE_BRANCH: ${{github.event.inputs.libs_corebase_branch}}
          LIBS_GUI_BRANCH: ${{github.event.inputs.libs_gui_branch}}
          LIBS_OPAL_BRANCH: ${{github.event.inputs.libs_opal_branch}}
        run: ./scripts/dependencies.sh

      - name: Build source
        run: |
          . $INSTALL_PATH/share/GNUstep/Makefiles/GNUstep.sh
          make -C Source
          make -C Source install

      - name: Run tests
        run: |
          . $INSTALL_PATH/share/GNUstep/Makefiles/GNUstep.sh
          cd Tests/quartzcore
          gnustep-tests

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Logs - ${{ matrix.name }}
          path: |
            ${{ env.SRC_PATH }}/Tests/quartzcore/tests.log
            ${{ env.DEPS_PATH }}/libs-base/config.log
            ${{ env.DEPS_PATH }}/libs-corebase/config.log

  ########### Linux (opal backend, virtual display) ###########
  # QuartzCore renders (CARenderer/OpenGL, CALayer display), so this job builds
  # a libs-back backend and runs the tests under a virtual X display, letting
  # any display- or render-dependent tests run instead of being skipped.  The
  # graphics backend is opal, to go with the Opal that is already built here.
  linux-headless:
    name: Ubuntu x64 Clang gnustep-2.0 (opal backend, Xvfb)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository

    env:
      SRC_PATH: ${{ github.workspace }}/source
      DEPS_PATH: ${{ github.workspace }}/dependencies
      INSTALL_PATH: ${{ github.workspace }}/build
      CC: clang
      CXX: clang++
      LIBRARY_COMBO: ng-gnu-gnu
      RUNTIME_VERSION: gnustep-2.0

    defaults:
      run:
        working-directory: ${{ env.SRC_PATH }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: ${{ env.SRC_PATH }}

      - name: Install packages
        run: ./scripts/install-packages.sh display

      - name: Install dependencies
        env:
          TOOLS_MAKE_BRANCH: ${{github.event.inputs.tools_make_branch}}
          LIBS_BASE_BRANCH: ${{github.event.inputs.libs_base_branch}}
          LIBS_COREBASE_BRANCH: ${{github.event.inputs.libs_corebase_branch}}
          LIBS_GUI_BRANCH: ${{github.event.inputs.libs_gui_branch}}
          LIBS_OPAL_BRANCH: ${{github.event.inputs.libs_opal_branch}}
        run: ./scripts/dependencies.sh

      - name: Build libs-back (opal backend)
        working-directory: ${{env.DEPS_PATH}}
        env:
          LIBS_BACK_BRANCH: ${{github.event.inputs.libs_back_branch}}
        run: |
          . $INSTALL_PATH/share/GNUstep/Makefiles/GNUstep.sh
          git clone -q -b ${LIBS_BACK_BRANCH:-master} https://github.com/gnustep/libs-back.git
          cd libs-back
          ./configure --enable-graphics=opal
          make && make install

      - name: Build source
        run: |
          . $INSTALL_PATH/share/GNUstep/Makefiles/GNUstep.sh
          make -C Source
          make -C Source install

      - name: Run tests
        run: |
          . $INSTALL_PATH/share/GNUstep/Makefiles/GNUstep.sh
          cd Tests/quartzcore
          xvfb-run -a gnustep-tests

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Logs - Ubuntu x64 Clang gnustep-2.0 (opal backend, Xvfb)
          path: |
            ${{ env.SRC_PATH }}/Tests/quartzcore/tests.log
